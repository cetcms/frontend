query Logout {
	logout
}

query Refresh {
	refresh {
		...Login
	}
}

mutation Login($input: LoginInput!) {
	login(input: $input) {
		...Login
	}
}

mutation SwitchAuthCompany($companyId: String) {
	switchAuthCompany(companyId: $companyId) {
		...Login
	}
}


query AuthInfo {
	authInfo {
		id
		createdAt
		updatedAt
		expiredAt
		adminId
		memberId
		companyId
		device
		location
		target
		permissions
		admin {
			...Admin
		}
		member {
			...Member
		}
		company {
			...Company
		}
	}
}