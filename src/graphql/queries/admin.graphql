
query PaginateAdmins($take: Int, $skip: Int, $where: AdminWhereInput, $orderBy: [AdminOrderByWithRelationInput!]) {
	paginateAdmins(take: $take, skip: $skip, where: $where, orderBy: $orderBy) {
		items {
			...Admin
		}
		pagination {
			...Pagination
		}
	}
}

query FindOneAdmin($id: String!) {
	findOneAdmin(where: { id: $id }) {
		...Admin
	}
}

mutation CreateOneAdmin($data: AdminCreateInput!) {
	createOneAdmin(data: $data) {
		...Admin
	}
}

mutation UpdateOneAdmin($id: String!, $data: AdminUpdateInput!) {
	updateOneAdmin(data: $data, where: { id: $id }) {
		...Admin
	}
}

